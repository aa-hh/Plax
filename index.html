<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f">
  <meta name="color-scheme" content="dark">
  <title>Plax</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="compat-marker" data-webos-version="" data-min-webos="5" hidden></div>

  <div id="app-root"></div>
  <div id="loading-overlay" class="loading-overlay hidden" aria-live="polite">
    <div class="loading-overlay-inner"></div>
  </div>
  <video id="native-player" class="native-player hidden" playsinline webkit-playsinline preload="metadata"></video>
  <script>
  /* Global error capture — runs before app bundle loads.
     Uses XMLHttpRequest (not fetch) so it works on Chromium 53 before
     polyfills are available. Reads sink URL from localStorage directly. */
  (function () {
    var LOG_SINK_KEY = 'plax_log_sink_url';

    function getSinkUrl() {
      try {
        var u = localStorage.getItem(LOG_SINK_KEY);
        if (u && String(u).trim()) return String(u).trim();
      } catch (e) { /* ignore */ }
      return null;
    }

    function postError(payload) {
      try {
        var url = getSinkUrl();
        if (!url) return;
        var body;
        try { body = JSON.stringify(payload); } catch (e) { return; }
        try {
          var xhr = new XMLHttpRequest();
          xhr.open('POST', url, true);
          xhr.setRequestHeader('Content-Type', 'application/json');
          xhr.send(body);
        } catch (e) { /* ignore */ }
      } catch (e) { /* handler must never throw */ }
    }

    window.addEventListener('error', function (evt) {
      try {
        var msg = evt && evt.message ? String(evt.message) : 'Unknown error';
        var detail = evt ? (evt.filename || '') + (evt.lineno != null ? ':' + evt.lineno : '') : '';
        postError({
          level: 'error',
          tag: 'global',
          message: msg,
          ts: new Date().toISOString(),
          detail: detail || undefined
        });
      } catch (e) { /* ignore */ }
    });

    window.addEventListener('unhandledrejection', function (evt) {
      try {
        var reason = evt && evt.reason != null ? evt.reason : 'Unhandled promise rejection';
        var msg = (reason && reason.message) ? String(reason.message) : String(reason);
        postError({
          level: 'error',
          tag: 'promise',
          message: msg,
          ts: new Date().toISOString()
        });
      } catch (e) { /* ignore */ }
    });
  }());
  </script>
  <script src="webOSTV.js"></script>
  <script src="build-info.js"></script>
  <script src="app.js"></script>
</body>
</html>
