<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    Content-Security-Policy: the key control is `script-src 'self'` (no
    'unsafe-inline'), which prevents any injected inline event handler
    (such as an onerror attribute) or inline script block from executing —
    so a DOM-XSS bug can no longer run script in the app origin and steal
    the auth token.
    connect/img/media stay broad because the app talks to arbitrary
    Plex/Jellyfin servers (any host, http or https) and renders data: QR
    codes; tightening those is not possible without breaking playback.
    NOTE: must be validated on the real B8 (Chromium 53) before merge —
    webOSTV.js or any polyfill using eval/inline would be blocked by this.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; media-src 'self' blob: data: https: http:; connect-src 'self' https: http:; font-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f">
  <meta name="color-scheme" content="dark">
  <title>Plax</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="compat-marker" data-webos-version="" data-min-webos="5" hidden></div>

  <div id="app-root"></div>
  <div id="loading-overlay" class="loading-overlay hidden" aria-live="polite">
    <div class="loading-overlay-inner"></div>
  </div>
  <video id="native-player" class="native-player hidden" playsinline webkit-playsinline preload="metadata"></video>
  <script src="early-errors.js"></script>
  <script src="webOSTV.js"></script>
  <script src="build-info.js"></script>
  <script src="app.js"></script>
</body>
</html>
