# XPlay user-flow manifest — declarative source of truth for the Figma board.
#
# Apply changes by editing this file then running:
#   node docs/design-system/flow/sync.mjs mermaid            # regenerate flow.mmd
#   node docs/design-system/flow/sync.mjs render --changed   # re-render changed screens
#   node docs/design-system/flow/sync.mjs plan               # show diff vs Figma
#   node docs/design-system/flow/sync.mjs apply              # run the diff via use_figma
#
# Schema:
#   sections[]: { key, title, pos:[x,y], size:[w,h], grid?:{originX,originY,colGap,rowGap} }
#   nodes[]:    { key, section, label, kind, screen?, pos?:[x,y]|at?:[row,col], size?:[w,h], figmaName }
#                 kind = screen | ref | hub | note
#                 pos = absolute (section-relative); at = grid cell — pick one
#   edges[]:    { from, to, label?, style?: solid|dashed, color?: blue|gray }
#
# `figmaName` is used ONCE during adoption to match the existing live frame; after that
# the frame is identified by its stamped shared-plugin-data key.

