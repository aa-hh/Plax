# XPlay user-flow manifest — declarative source of truth for the Figma board.
# Apply changes by editing this file then running sync.mjs.
#
# Schema:
#   sections[]: { key, title, pos:[x,y], size:[w,h] }
#   nodes[]:    { key, section, label, kind, screen?, pos?:[x,y]|at?:[row,col], size?:[w,h], figmaName }
#                 kind = screen | ref | hub | note
#                 pos = absolute (section-relative); at = grid cell [row, col]
#   edges[]:    { from, to, label?, style?: solid|dashed, color?: blue|gray }
#
# Layout: when nodes use `at: [row, col]`, the section's `grid:{originX,originY,colGap,rowGap}`
# computes their absolute pos. Mix-and-match supported.

figmaFileKey: WI3ps729HoHyWQKfEG3XSH
options:
  manageEdges: true   # reconciler owns the edge layer (auto-route + label)

